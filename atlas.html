<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOCORA world atlas</title><style>:root{color-scheme:dark;--ink:#fff1dc;--muted:#c2b19e;--line:#443329;--accent:#ff8848}*{box-sizing:border-box}body{margin:0;background:#100e0c;color:var(--ink);font:14px/1.5 system-ui,sans-serif}button,select{font:inherit;color:var(--ink);background:#211912;border:1px solid var(--line);border-radius:8px;padding:7px 11px}button{cursor:pointer}button[aria-pressed=true]{border-color:var(--accent);background:#3b2116}button:hover,select:hover{border-color:#ffad75}:focus-visible{outline:2px solid #ffd197;outline-offset:3px}#atlas{min-height:100vh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 52% 34%,#281911,#100e0c 66%)}.toolbar,.map-footer{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 14px;padding:13px 16px}.toolbar{border-bottom:1px solid var(--line)}.toolbar strong{font-size:12px;letter-spacing:.15em;color:var(--accent)}.controls{display:flex;gap:5px}.controls>button{white-space:nowrap}.stage{position:relative;min-height:230px;flex:1;height:clamp(230px,56vh,540px);overflow:hidden}.stage canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:pan-y}.stage canvas:active{cursor:grabbing}.map-footer{border-top:1px solid var(--line);color:var(--muted);font-size:12px}.card{padding:14px 16px 17px;background:#19140f;border-top:1px solid var(--line);min-height:126px}.card h2{font-size:clamp(16px,3.5vw,22px);line-height:1.15;margin:5px 0 8px}.card p{margin:0;color:var(--muted)}.label{display:flex;justify-content:space-between;gap:10px;color:var(--accent);font-size:12px;font-weight:700}.select{display:flex;align-items:center;gap:7px}.select select{max-width:144px;padding:4px 7px}@media(max-width:470px){.toolbar,.map-footer,.card{padding-inline:10px}.toolbar{gap:5px}.controls button{padding:4px 7px;font-size:12px}.map-footer{gap:5px}.stage{height:49vh}}.toolbar{border-bottom-color:#ffffff12}.toolbar strong{color:#ffac72}.toolbar,.map-footer{padding-inline:18px}.stage{background:radial-gradient(ellipse at 50% 49%,#16202a44,transparent 69%)}#atlas{background:radial-gradient(ellipse at 48% 39%,#171d25,#0a0d11 74%)}button,select{background:#15191e;border-color:#313b47;border-radius:6px}.card{background:#13171c;border-top-color:#ffffff16}.map-footer{border-top-color:#ffffff12}.map-footer,.card p{color:#a6afb9}.card h2{color:#f4ede4}.label{color:#ffab72}#atlas{height:100vh;min-height:0}.stage{flex:1 1 0;height:auto;min-height:0}.toolbar,.map-footer,.card{flex:none}.controls{max-width:100%;flex-wrap:wrap}.card{min-height:122px}@media(max-width:440px){.toolbar strong{width:100%}.toolbar,.map-footer{padding-inline:12px}.card{min-height:138px}}</style><script src="./atlas-land.js" defer></script><script src="./atlas.js?v=night2" defer></script></head><body><main id="atlas"><header class="toolbar"><strong>LOCORA ATLAS</strong><div class="controls" role="group" aria-label="Map view"><button type="button" data-view="0" aria-pressed="true">Globe</button><button type="button" data-view="1" aria-pressed="false">World map</button><button type="button" id="spin" aria-pressed="true">Pause rotation</button></div></header><div class="stage"><canvas id="world" tabindex="0" aria-label="World atlas. Drag horizontally or use arrow keys to rotate. Select a city below to view its task."></canvas></div><div class="map-footer"><label class="select">City <select id="cities"></select></label><span id="coordinates"></span><span>Example locations</span></div><section class="card" aria-live="polite"><div class="label"><span id="city"></span><span id="amount"></span></div><h2 id="question"></h2><p id="detail"></p></section><noscript>Enable JavaScript to explore the globe.</noscript></main></body></html>
