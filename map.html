<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Explore sample location requests and USDC bounties around the world.">
  <title>World map | LOCORA</title>
  <link rel="icon" href="/LOCORA-/locora-brand.png">
  <link rel="preload" href="_next/static/media/newsreader-s.p.0op912u62qdhl.woff2" as="font" crossorigin="" type="font/woff2"/>
  <link rel="stylesheet" href="./field-preview.css">
  <script defer src="./atlas-land.js"></script>
  <script defer src="./atlas.js?v=map-clean1"></script>
<link rel="stylesheet" href="./locora-theme.css?v=disc1"></head>
<body class="field-map">
  <header class="field-header">
    <a class="field-brand" href="./"><img src="/LOCORA-/locora-brand.png" width="34" height="34" alt="">LOCORA</a>
    <nav aria-label="Main">
      <a href="./#how">How it works</a>
      <a href="./docs.html">Docs</a>
      <a href="./map/" aria-current="page">World map</a>
    </nav>
  </header>
  <main>
    <div class="field-heading">
      <p>Location requests</p>
      <h1>Around the world.<br><em>Questions that pay.</em></h1>
      <p>Choose a city to explore a sample photo request and its USDC bounty.</p>
    </div>
    <section id="atlas" class="field-grid" aria-label="Interactive world map">
      <div class="field-stage">
        <canvas id="world" tabindex="0" aria-label="Drag or use arrow keys to rotate the globe. Use the city menu to select a request."></canvas>
        <p class="field-coordinates" id="coordinates"></p>
      </div>
      <aside class="field-request">
        <div class="field-label"><span>Demo request</span><span id="amount"></span></div>
        <label for="cities">Choose a city</label>
        <select id="cities"></select>
        <div class="field-description" aria-live="polite">
          <p id="city"></p>
          <h2 id="question"></h2>
          <p id="detail"></p>
        </div>
        <p class="field-note">This preview uses sample data. Bounties cannot be claimed here.</p>
      </aside>
    </section>
    <noscript><p>Enable JavaScript to explore the world map.</p></noscript>
  </main>
</body>
</html>
